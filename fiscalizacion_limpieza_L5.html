<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00985F">
<title>Fiscalización Limpieza Línea 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --naranjo:#EE7623; --naranjo2:#D9641A; --verde:#00985F; --verde2:#007A4C;
  --ink:#1E2A2E; --ink2:#5B6B70; --card:#FFFFFF; --line:#E3D6CC;
  --ok:#1F8A4C; --bad:#C0392B; --warn:#E0A100;
  box-sizing:border-box; padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--naranjo);color:#fff;font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--verde);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;box-shadow:0 2px 0 var(--verde2)}
.top{display:flex;align-items:center;gap:12px;max-width:680px;margin:0 auto}
.l5{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;color:var(--verde);display:grid;place-items:center;font-weight:700;font-size:19px;border:3px solid #fff;box-shadow:inset 0 0 0 3px var(--verde)}
.top h1{font-size:19px;line-height:1.2;margin:0}
.top small{display:block;font-size:14px;opacity:.85;font-weight:400}
.prog{display:flex;gap:4px;margin:10px auto 0;max-width:680px}
.prog i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.3)}
.prog i.done{background:#fff} .prog i.now{background:var(--naranjo)}
main{max-width:680px;margin:0 auto;padding:18px 14px 120px}
h2{font-size:24px;margin:2px 0 4px;color:#fff} .sub{margin:0 0 16px;color:#FFE9D9}
.card{background:var(--card);color:var(--ink);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:18px}
label{display:block;font-weight:700;margin:12px 0 6px;color:var(--ink)}
label:first-child{margin-top:0}
input[type=text],input[type=search],select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--verde);outline-offset:2px}
.seg{display:flex;gap:6px}
.seg button{flex:1}
button{font:inherit;font-weight:700;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink);padding:11px 12px;cursor:pointer}
button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-of-type{border-top:0;padding-top:4px}
.item p{margin:0 0 8px;font-weight:700}
.item .seg button.sel.c{background:var(--ok);border-color:var(--ok);color:#fff}
.item .seg button.sel.n{background:var(--bad);border-color:var(--bad);color:#fff}
.item textarea{margin-top:8px;min-height:60px}
.item.miss p{color:var(--bad)}
.ficha{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;background:#F6F1EC;border-radius:10px;padding:10px 12px;margin-top:10px}
.ficha b{color:var(--ink2);font-weight:400}
.lista{max-height:240px;overflow:auto;border:2px solid var(--line);border-radius:10px;margin-top:8px}
.lista button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;font-weight:400;padding:10px 12px}
.lista button small{color:var(--ink2)}
.lista button.sel{background:var(--verde);color:#fff}.lista button.sel small{color:#E6FFF4}
.gps{border-radius:10px;padding:12px;margin-top:10px;border:2px solid var(--line)}
.gps strong{font-size:22px;display:block}
.gps.g{border-color:var(--ok)}.gps.g strong{color:var(--ok)}
.gps.y{border-color:var(--warn)}.gps.y strong{color:#9A6F00}
.gps.r{border-color:var(--bad)}.gps.r strong{color:var(--bad)}
.btn-verde{width:100%;background:var(--verde);border-color:var(--verde);color:#fff}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.thumbs div{position:relative}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.thumbs button{position:absolute;top:4px;right:4px;padding:1px 8px;font-size:13px}
canvas#firma{width:100%;height:170px;background:#fff;border:2px dashed var(--line);border-radius:10px;touch-action:none;display:block}
.score{font-size:60px;font-weight:700;line-height:1;margin:4px 0;color:#fff}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:7px 2px;border-bottom:1px solid var(--line)} td:last-child{text-align:right;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--naranjo2);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;gap:10px;max-width:680px;margin:0 auto}
nav button{flex:1;padding:14px}
nav .go{background:var(--verde);border-color:var(--verde);color:#fff}
.note{color:var(--ink2);font-size:14px;margin:6px 0 0}
.pend{background:#fff;color:var(--ink);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:15px;display:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;max-width:90%;display:none;z-index:9}
</style>
</head>

function haversine(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);
  const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h)));}
function gpsClase(){if(!S.gps)return"";if(S.dist==null)return"y";return S.dist<=GPS_OK?"g":S.dist<=GPS_WARN?"y":"r";}

    </div>
    <div class="card"><h3>Jefe de estación</h3>
      <label for="je">Nombre</label><input id="je" type="text" value="${esc(S.jefe)}">
      <label>Condición</label><div class="seg" id="cond">
        <button data-v="Presente" class="${S.condJefe==="Presente"?"sel":""}">Presente</button>
        <button data-v="Dupla" class="${S.condJefe==="Dupla"?"sel":""}">Dupla</button></div>
      ${S.condJefe==="Dupla"?`<label for="ed">¿En qué estación se encuentra?</label><select id="ed">${opts(todasEst().filter(e=>e!==S.estacion),S.estDupla,"Selecciona estación…")}</select>`:""}
      <label for="oe">Observación</label><textarea id="oe" placeholder="Opcional">${esc(S.obsEnc)}</textarea>
    </div>
    <div class="card"><h3>Ubicación</h3>
      <button id="cap" class="btn-verde">${S.gps?"Volver a capturar":"Capturar ubicación"}</button>
      ${S.gps?`<div class="gps ${c}"><strong>${S.dist!=null?S.dist.toLocaleString("es-CL")+" m":"Ubicación capturada"}</strong>
        ${S.dist!=null?({g:"Dentro del radio de la estación",y:"Fuera del radio recomendado",r:"Lejos de la estación"}[c]):"Esta estación aún no tiene coordenadas cargadas; se guarda tu posición igual"} · precisión ±${S.gps.acc} m</div>`:""}
      <p class="note" id="gpsmsg"></p></div>`;
    v.innerHTML=h;
    $("#sup").onchange=e=>S.supervisor=e.target.value;
    $("#tur").onchange=e=>{if(S.turno!==e.target.value){S.turno=e.target.value;S.trab=null;}};
    $("#zon").onchange=e=>{S.zona=e.target.value;S.estacion="";S.dist=null;render(true);};
    $("#est").onchange=e=>{S.estacion=e.target.value;if(S.estDupla===S.estacion)S.estDupla="";calcDist();render(true);};
    $("#je").oninput=e=>S.jefe=e.target.value;
    $("#cond").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.condJefe=b.dataset.v;if(S.condJefe==="Presente")S.estDupla="";render(true);};
    const ed=$("#ed");if(ed)ed.onchange=e=>S.estDupla=e.target.value;
    $("#oe").oninput=e=>S.obsEnc=e.target.value;
    $("#cap").onclick=()=>{
      if(!S.estacion){toast("Primero selecciona la estación.");return;}
      $("#gpsmsg").textContent="Obteniendo ubicación…";
      if(!navigator.geolocation){$("#gpsmsg").textContent="Este equipo no permite GPS.";return;}
      navigator.geolocation.getCurrentPosition(p=>{
        S.gps={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),hora:new Date().toISOString()};
        calcDist();render(true);
      },err=>{$("#gpsmsg").textContent="No se pudo obtener la ubicación. Activa el GPS y permite el acceso en el navegador.";},
      {enableHighAccuracy:true,timeout:20000,maximumAge:0});
    };
  }

  else if(id==="trab"){
    const q=S.busca.trim().toLowerCase();
    const lista=TRABAJADORES.filter(t=>t.t===S.turno&&(!q||t.n.toLowerCase().includes(q)||t.r.toLowerCase().replace(/\./g,"").includes(q.replace(/\./g,""))));
    const sec=SECCIONES[0];
    h=`<h2>Auxiliar de aseo</h2><p class="sub">Turno ${esc(S.turno)}: ${TRABAJADORES.filter(t=>t.t===S.turno).length} trabajadores</p>
    <div class="card">
      <label for="bq">Buscar por nombre o RUT</label><input id="bq" type="search" value="${esc(S.busca)}" autocomplete="off">
      <div class="lista" id="lst">${lista.length?lista.slice(0,80).map(t=>`<button data-r="${t.r}" class="${S.trab?.r===t.r?"sel":""}">${esc(t.n)}<br><small>${t.r}</small></button>`).join(""):`<p class="note" style="padding:10px">Sin resultados en el turno ${esc(S.turno)}.</p>`}</div>
      ${S.trab?`<div class="ficha"><b>Nombre</b><span>${esc(S.trab.n)}</span><b>RUT</b><span>${S.trab.r}</span><b>Cargo</b><span>${esc(S.trab.c)}</span><b>N° chip</b><span>${S.trab.ch||"Sin registro"}</span></div>`:""}
    </div>
    <div class="card"><h3>${sec.titulo}</h3>${itemsHtml(sec)}</div>`;
    v.innerHTML=h;
    const bq=$("#bq");bq.oninput=e=>{S.busca=e.target.value;const p=bq.selectionStart;render(true);const n=$("#bq");n.focus();n.setSelectionRange(p,p);};
    $("#lst").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.trab=TRABAJADORES.find(t=>t.r===b.dataset.r);render(true);};
    bindItems();
  }

  else if(SECCIONES.some(s=>s.id===id)){
    const sec=SECCIONES.find(s=>s.id===id);
    h=`<h2>${sec.titulo}</h2><p class="sub">${esc(S.estacion)}</p><div class="card">${itemsHtml(sec)}</div>`;
    v.innerHTML=h;bindItems();
  }

  else if(id==="fotos"){
    h=`<h2>Evidencia</h2><p class="sub">Hasta ${MAX_FOTOS} fotos de los hallazgos.</p>
    <div class="card"><input type="file" id="foto" accept="image/*" capture="environment" ${S.fotos.length>=MAX_FOTOS?"disabled":""}>
      <div class="thumbs">${S.fotos.map((f,i)=>`<div><img src="${f}" alt="Foto ${i+1}"><button data-i="${i}" aria-label="Quitar foto">✕</button></div>`).join("")}</div>
      <label for="og">Observación general</label><textarea id="og">${esc(S.obsGeneral)}</textarea></div>`;
    v.innerHTML=h;
    $("#foto").onchange=async e=>{const f=e.target.files[0];if(!f)return;S.fotos.push(await comprimir(f));render(true);};
    v.querySelectorAll(".thumbs button").forEach(b=>b.onclick=()=>{S.fotos.splice(+b.dataset.i,1);render(true);});
    $("#og").oninput=e=>S.obsGeneral=e.target.value;
  }

  else if(id==="cierre"){
    const p=puntaje(),nc=noCumple();
    h=`<h2>Resumen</h2><p class="sub">${esc(S.estacion)} · ${esc(S.zona)} · turno ${esc(S.turno)}</p>
    <div class="score">${p.total}%</div><p class="sub">de cumplimiento (${nc.length} punto${nc.length===1?"":"s"} sin cumplir)</p>
    <div class="card"><table>
      <tr><td>Supervisor</td><td>${esc(S.supervisor)}</td></tr>
      <tr><td>Jefe de estación</td><td>${esc(S.jefe)} · ${S.condJefe}${S.condJefe==="Dupla"?" ("+esc(S.estDupla)+")":""}</td></tr>
      <tr><td>Auxiliar</td><td>${esc(S.trab.n)}</td></tr>
      <tr><td>GPS</td><td>${S.dist!=null?S.dist+" m":"Sin coordenadas"}</td></tr>
      ${SECCIONES.map(s=>`<tr><td>${s.titulo.replace("Revisión ","")}</td><td>${p.sec[s.id]}%</td></tr>`).join("")}
    </table></div>
    ${nc.length?`<div class="card"><h3>Puntos sin cumplir</h3><table>${nc.map(x=>`<tr><td>${esc(x.seccion)}: ${esc(x.item)}</td><td style="font-weight:400">${esc(x.obs)}</td></tr>`).join("")}</table></div>`:""}
    <div class="card"><label>Firma ${S.condJefe==="Presente"?"del jefe de estación":"de quien recibe (opcional, jefe en dupla)"}</label>
      <canvas id="firma"></canvas><button id="limpiar" style="margin-top:8px">Borrar firma</button></div>`;
    v.innerHTML=h;initFirma();
  }
  if(!keepScroll)window.scrollTo(0,0);else window.scrollTo(0,y);
}

function puntaje(){let tc=0,tn=0;const sec={};
  SECCIONES.forEach(s=>{const c=s.items.filter((_,i)=>S.resp[s.id+"_"+i]==="c").length;sec[s.id]=Math.round(c/s.items.length*100);tc+=c;tn+=s.items.length;});
  return {total:Math.round(tc/tn*100),sec};}
function noCumple(){return SECCIONES.flatMap(s=>s.items.map((it,i)=>({k:s.id+"_"+i,seccion:s.titulo.replace("Revisión ",""),item:it}))
  .filter(x=>S.resp[x.k]==="n").map(x=>({...x,obs:S.obsItem[x.k]||""})));}

function validarItems(sec){
  const f=sec.items.map((_,i)=>sec.id+"_"+i).filter(k=>!S.resp[k]);
  if(f.length){f.forEach(k=>$("#it_"+k).classList.add("miss"));$("#it_"+f[0]).scrollIntoView({behavior:"smooth",block:"center"});return`Faltan ${f.length} punto(s) por evaluar.`;}
  const o=sec.items.map((_,i)=>sec.id+"_"+i).filter(k=>S.resp[k]==="n"&&!(S.obsItem[k]||"").trim());
  if(o.length){$("#it_"+o[0]).scrollIntoView({behavior:"smooth",block:"center"});return"Escribe la observación de cada punto que no cumple.";}
  return null;}

function validar(){const id=STEPS[cur];
  if(id==="ident"){
    if(!S.supervisor)return"Selecciona el supervisor.";if(!S.turno)return"Selecciona el turno.";
    if(!S.zona)return"Selecciona la zona.";if(!S.estacion)return"Selecciona la estación.";
    if(!S.jefe.trim())return"Escribe el nombre del jefe de estación.";if(!S.condJefe)return"Indica si el jefe de estación está presente o en dupla.";
    if(S.condJefe==="Dupla"&&!S.estDupla)return"Indica en qué estación está el jefe de estación.";
    if(!S.gps)return"Captura la ubicación para continuar.";
    if(S.dist!=null&&S.dist>GPS_WARN&&!confirm(`Estás a ${S.dist} m de ${S.estacion}. ¿Continuar igual? Quedará registrado.`))return"";}
  if(id==="trab"){if(!S.trab)return"Selecciona al auxiliar de aseo.";return validarItems(SECCIONES[0]);}
  const sec=SECCIONES.find(s=>s.id===id);if(sec)return validarItems(sec);
  if(id==="cierre"&&S.condJefe==="Presente"&&!S.firma)return"Falta la firma del jefe de estación.";
  return null;}

function comprimir(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const m=1024,k=Math.min(1,m/Math.max(img.width,img.height));
  const cv=document.createElement("canvas");cv.width=img.width*k;cv.height=img.height*k;cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  URL.revokeObjectURL(img.src);res(cv.toDataURL("image/jpeg",.6));};img.src=URL.createObjectURL(file);});}

function initFirma(){const cv=$("#firma"),r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;const x=cv.getContext("2d");x.scale(dpr,dpr);x.lineWidth=2.2;x.lineCap="round";x.strokeStyle="#1E2A2E";
  if(S.firma){const im=new Image();im.onload=()=>x.drawImage(im,0,0,r.width,r.height);im.src=S.firma;}
  let d=false;const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
  cv.onpointerdown=e=>{d=true;cv.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pt(e));};
  cv.onpointermove=e=>{if(d){x.lineTo(...pt(e));x.stroke();}};
  cv.onpointerup=()=>{d=false;S.firma=cv.toDataURL("image/png");};
  $("#limpiar").onclick=()=>{x.clearRect(0,0,cv.width,cv.height);S.firma=null;};}

/* -------- Envío (formulario oculto, igual que la app de seguridad) + cola sin conexión -------- */
const QK="fisc_limpieza_l5_pend";
const cola=()=>{try{return JSON.parse(localStorage.getItem(QK)||"[]");}catch{return[];}};
function setCola(q){try{localStorage.setItem(QK,JSON.stringify(q));}catch{toast("Memoria del equipo llena: no se pudo guardar el pendiente.");}pintarCola();}
function pintarCola(){const n=cola().length,el=$("#pend");el.style.display=n?"block":"none";
  el.innerHTML=n?`${n} fiscalización(es) guardada(s) sin enviar. <button id="reenv" style="padding:6px 10px;margin-left:6px">Enviar ahora</button>`:"";
  if(n)$("#reenv").onclick=reintentar;}
function post(d){return new Promise((res,rej)=>{
  if(!SCRIPT_URL||!navigator.onLine)return rej();
  const f=document.createElement("form");f.method="POST";f.action=SCRIPT_URL;f.target="envio";f.style.display="none";
  const i=document.createElement("input");i.type="hidden";i.name="payload";i.value=JSON.stringify(d);f.appendChild(i);
  document.body.appendChild(f);f.submit();setTimeout(()=>{f.remove();res();},2500);});}
async function reintentar(){const q=cola(),rest=[];for(const d of q){try{await post(d);}catch{rest.push(d);}}setCola(rest);
  toast(rest.length?`Quedan ${rest.length} sin enviar. Revisa la conexión.`:"Fiscalizaciones pendientes enviadas.");}

function armar(){const p=puntaje();
  return {id:"FL5-"+Date.now(),fecha:new Date().toISOString(),supervisor:S.supervisor,turno:S.turno,zona:S.zona,estacion:S.estacion,
    jefe:S.jefe.trim(),condJefe:S.condJefe,estDupla:S.estDupla,obsEnc:S.obsEnc,
    lat:S.gps.lat,lng:S.gps.lng,precision:S.gps.acc,distancia:S.dist??"",estadoGps:gpsEstado(),
    auxNombre:S.trab.n,auxRut:S.trab.r,auxCargo:S.trab.c,auxChip:S.trab.ch,auxSap:S.trab.s,
    total:p.total,porSeccion:p.sec,
    detalle:SECCIONES.flatMap(s=>s.items.map((it,i)=>({seccion:s.titulo,item:it,resultado:S.resp[s.id+"_"+i]==="c"?"Cumple":"No cumple",obs:S.obsItem[s.id+"_"+i]||""}))),
    obsGeneral:S.obsGeneral,firma:S.firma||"",fotos:S.fotos};}

async function enviar(){const d=armar();$("#next").disabled=true;$("#next").textContent="Enviando…";
  let ok=true;try{await post(d);}catch{ok=false;setCola([...cola(),d]);}
  document.querySelector("nav").style.display="none";
  $("#view").innerHTML=`<h2>${ok?"Fiscalización enviada":"Guardada en el equipo"}</h2>
    <p class="sub">${ok?"Registro "+d.id+" enviado.":"Sin conexión o sin URL configurada. Usa “Enviar ahora” cuando tengas señal."}</p>
    <div class="score">${d.total}%</div><p class="sub">${esc(d.estacion)} · ${esc(d.auxNombre)}</p>
    <button id="nueva" class="btn-verde" style="margin-top:16px">Nueva fiscalización</button>`;
  $("#nueva").onclick=()=>{sessionStorage.setItem("fl5_sup",S.supervisor);sessionStorage.setItem("fl5_tur",S.turno);location.reload();};
  pintarCola();window.scrollTo(0,0);}

$("#next").onclick=()=>{const e=validar();if(e===""){return;}if(e){toast(e);return;}
  if(STEPS[cur]==="cierre"){enviar();return;}cur++;render();};
$("#back").onclick=()=>{if(cur){cur--;render();}};
try{S.supervisor=sessionStorage.getItem("fl5_sup")||"";S.turno=sessionStorage.getItem("fl5_tur")||"";}catch{}
window.addEventListener("online",()=>{if(cola().length)reintentar();});
pintarCola();render();
</script>
</body>
