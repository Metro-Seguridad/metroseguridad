<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Fiscalización | MetroSeguridad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{--bg:#0F1124;--sf:#1A1E36;--sf2:#242952;--acc:#FF4B2B;--acc-l:rgba(255,75,43,.12);--grn:#1DB86A;--grn-l:rgba(29,184,106,.12);--red:#E83A3A;--red-l:rgba(232,58,58,.12);--ylw:#F5A623;--ylw-l:rgba(245,166,35,.12);--blu:#3B82F6;--txt:#EEF0FB;--txt2:#8E97C7;--bdr:#2A2F55;--r:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;min-height:100vh}
.hd{background:var(--sf);border-bottom:1px solid var(--bdr);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:8px}
.pip{width:8px;height:8px;background:var(--acc);border-radius:50%}
.brand-t{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--txt2)}
.page-t{font-size:17px;font-weight:700}
.last-upd{font-size:12px;color:var(--txt2)}
.wrap{max-width:1440px;margin:0 auto;padding:24px 28px}
.banner{background:var(--acc-l);border:1px solid var(--acc);border-radius:10px;padding:14px 18px;margin-bottom:22px;font-size:13px;display:none}
.banner.show{display:block}
.banner code{background:var(--sf2);padding:2px 7px;border-radius:4px;font-family:monospace;font-size:12px}
.filters{display:flex;align-items:center;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.fl-lbl{font-size:12px;color:var(--txt2);font-weight:600}
.fb{padding:7px 16px;border-radius:6px;border:1.5px solid var(--bdr);background:var(--sf);color:var(--txt2);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.fb:hover{border-color:var(--txt2);color:var(--txt)}
.fb.on{border-color:var(--acc);color:var(--acc);background:var(--acc-l)}
.fb.refresh{margin-left:auto;border-color:var(--txt2)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpi{background:var(--sf);border:1px solid var(--bdr);border-radius:var(--r);padding:20px}
.kpi-lbl{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--txt2);margin-bottom:8px}
.kpi-val{font-size:34px;font-weight:700;line-height:1;margin-bottom:6px}
.kpi-sub{font-size:12px;color:var(--txt2)}
.c-acc{color:var(--acc)}.c-ok{color:var(--grn)}.c-warn{color:var(--ylw)}.c-bad{color:var(--red)}.c-blu{color:var(--blu)}
.row{display:grid;gap:16px;margin-bottom:16px}
.r2{grid-template-columns:2fr 1fr}
.r22{grid-template-columns:1fr 1fr}
.r1{grid-template-columns:1fr}
.card{background:var(--sf);border:1px solid var(--bdr);border-radius:var(--r);padding:20px;min-width:0}
.c-title{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--txt2);margin-bottom:16px}
.chart-wrap{position:relative;height:260px}
.chart-wrap.tall{height:320px}
.chart-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:13px}
.tbl-wrap{overflow-x:auto;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
th{text-align:left;padding:10px 12px;color:var(--txt2);font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;border-bottom:1px solid var(--bdr);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--bdr);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.b-ok{color:var(--grn);font-weight:600;font-size:12px}
.b-no{color:var(--red);font-weight:600;font-size:12px}
.b-na{color:var(--txt2);font-size:12px}
.tipo-d{background:var(--acc-l);color:var(--acc);padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700}
.tipo-a{background:var(--grn-l);color:var(--grn);padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:var(--txt2);gap:16px}
.spinner{width:36px;height:36px;border:3px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:var(--txt2);font-size:14px}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.r2,.r22{grid-template-columns:1fr}.wrap{padding:16px}.hd{padding:12px 16px}}
@media(max-width:480px){.kpi-grid{grid-template-columns:1fr 1fr}.kpi-val{font-size:26px}.page-t{font-size:14px}}
</style>
</head>
<body>

<header class="hd">
  <div class="brand"><div class="pip"></div><span class="brand-t">MetroSeguridad</span></div>
  <div class="page-t">Panel de Fiscalización</div>
  <div class="last-upd" id="lastUpd">—</div>
</header>

<div class="wrap">
  <div class="banner" id="banner"></div>

  <div class="filters">
    <span class="fl-lbl">Período:</span>
    <button class="fb" data-p="today" onclick="setPeriod('today')">Hoy</button>
    <button class="fb" data-p="week"  onclick="setPeriod('week')">Esta semana</button>
    <button class="fb" data-p="month" onclick="setPeriod('month')">Este mes</button>
    <button class="fb" data-p="all"   onclick="setPeriod('all')">Todo</button>
    <button class="fb refresh" onclick="refresh()">↺ Actualizar</button>
  </div>

  <div class="kpi-grid" id="kpiGrid">
    <div class="loading" style="grid-column:1/-1"><div class="spinner"></div>Cargando datos...</div>
  </div>

  <div class="row r2">
    <div class="card"><div class="c-title">Actividad diaria</div><div class="chart-wrap"><canvas id="cActivity"></canvas></div></div>
    <div class="card"><div class="c-title">Tipo de fiscalización</div><div class="chart-wrap"><canvas id="cTipo"></canvas></div></div>
  </div>

  <div class="row r1">
    <div class="card"><div class="c-title">Cumplimiento por categoría (%)</div><div class="chart-wrap tall"><canvas id="cCumpl"></canvas></div></div>
  </div>

  <div class="row r22">
    <div class="card"><div class="c-title">Fiscalizaciones por zona</div><div class="chart-wrap"><canvas id="cZona"></canvas></div></div>
    <div class="card"><div class="c-title">Por cargo fiscalizado</div><div class="chart-wrap"><canvas id="cCargo"></canvas></div></div>
  </div>

  <div class="row r22">
    <div class="card"><div class="c-title">Fiscalizaciones por responsable</div><div class="chart-wrap"><canvas id="cResp"></canvas></div></div>
    <div class="card"><div class="c-title">Categorías con más incumplimientos</div><div class="chart-wrap"><canvas id="cIncumpl"></canvas></div></div>
  </div>

  <div class="card">
    <div class="c-title">Últimas fiscalizaciones</div>
    <div id="tblContainer"><div class="empty">Sin datos</div></div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzBdPl1DBa2rQEpiqUg1WtSEhL6NjcPpe-eV2jlkDhUwdcrBUvObwfzf1-XpBgBpNeq/exec';

// ── COLUMNAS (mismo orden que HEADERS del Apps Script) ────────────
const C = {TS:0,TIPO:1,FECHA:2,HORA:3,SUP:4,INSP:5,LINEA:6,ZONA:7,EST:8,
  LAT:9,LON:10,GD:11,GA:12,JEFE:13,NOM:14,RUT:15,CARGO:16,TURNO:17,
  UNIF:18,PRENDAS:19,CREDC:20,CREDOS:21,EPP:22,RADIO:23,MANOS:24,
  LLAVE:25,PRES:26,PRES_OBS:27,POS:28,DIR:29,DIR_OBS:30,
  C1:31,C2:32,C3:33,C4:34,CEL:35,OBS:36};

let allRows=[], period='week', charts={};

// ── UTILIDADES ────────────────────────────────────────────────────
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lc=v=>String(v??'').trim().toLowerCase();
const pad=n=>String(n).padStart(2,'0');

function showBanner(html){const b=document.getElementById('banner');b.innerHTML=html;b.classList.add('show');}
function hideBanner(){document.getElementById('banner').classList.remove('show');}

// Acepta "07/10/2026", "07-10-2026", "2026-10-07", ISO "2026-10-07T03:00:00.000Z"
function parseDate(s){
  if(!s)return null;
  const t=String(s).trim();
  let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})T/);              // ISO con hora (Date serializado)
  if(m){const d=new Date(t);return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());}
  m=t.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);          // yyyy-mm-dd
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  m=t.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);        // dd/mm/yyyy
  if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]);}
  return null;
}
const fmtDate=d=>d?`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`:'—';

function fmtHora(v){
  if(!v)return'';
  const t=String(v);
  if(/T\d{2}:\d{2}/.test(t)){const d=new Date(t);if(!isNaN(d))return`${pad(d.getHours())}:${pad(d.getMinutes())}`;}
  return t;
}

// Fecha efectiva de la fila: columna Fecha y, si falla, el Timestamp
function rowDate(r){return parseDate(r[C.FECHA])||parseDate(r[C.TS]);}

// ── FETCH JSONP ───────────────────────────────────────────────────
function fetchData(){
  return new Promise((res,rej)=>{
    if(!SCRIPT_URL){showBanner('⚠️ Configura <code>SCRIPT_URL</code> al inicio del script con la URL de tu Apps Script.');res([]);return;}
    const cb='cb_'+Date.now();
    const s=document.createElement('script');
    let timer;
    const cleanup=()=>{clearTimeout(timer);delete window[cb];s.remove();};
    window[cb]=(data)=>{
      cleanup();
      if(data&&data.error){rej(new Error(data.error));return;}
      res((data&&data.rows)||[]);
    };
    s.src=`${SCRIPT_URL}?action=getData&callback=${cb}&_=${Date.now()}`;
    s.onerror=()=>{cleanup();rej(new Error('No se pudo conectar con el Apps Script (revisa que esté implementado con acceso "Cualquier persona").'));};
    document.body.appendChild(s);
    timer=setTimeout(()=>{cleanup();rej(new Error('Tiempo de espera agotado (15 s).'));},15000);
  });
}

// ── FILTRO PERÍODO ────────────────────────────────────────────────
function setPeriod(p){
  period=p;
  document.querySelectorAll('.fb[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  render(filter(allRows));
}

function filter(rows){
  if(period==='all')return rows;
  const now=new Date(),sod=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const mon=new Date(sod);mon.setDate(sod.getDate()-((sod.getDay()+6)%7));
  return rows.filter(r=>{
    const d=rowDate(r);if(!d)return false;
    if(period==='today')return d.getTime()===sod.getTime();
    if(period==='week')return d>=mon&&d<=sod;
    if(period==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    return true;
  });
}

// ── REGLAS DE CUMPLIMIENTO (una sola fuente para KPIs, gráficos y tabla) ──
const isNA=v=>lc(v).includes('no aplica');
const R={
  ok:v=>{const s=lc(v);return s.includes('cumple')&&!s.includes('no cumple');},
  tiene:v=>lc(v)==='tiene',
  buena:v=>lc(v)==='buena',
  aplica:v=>lc(v)==='aplica',
  epp:v=>!lc(v).includes('no cumple')
};
// [etiqueta, columna, regla, se omite si "No aplica", se omite si vacío]
const CATS=[
  ['Uniforme',C.UNIF,R.ok,false,false],
  ['Cred. Contratista',C.CREDC,R.tiene,false,false],
  ['Cred. OS-10',C.CREDOS,R.tiene,true,false],
  ['EPP',C.EPP,R.epp,false,true],
  ['Radio',C.RADIO,R.ok,false,false],
  ['Manos libres',C.MANOS,R.ok,false,false],
  ['Presentación',C.PRES,R.buena,false,false],
  ['Posición',C.POS,R.ok,false,false],
  ['Directiva',C.DIR,R.aplica,true,false],
  ['Celular',C.CEL,R.ok,false,false]
];
// Devuelve {cat: true(cumple)/false(no cumple)} sólo para las categorías evaluables
function evalRow(r){
  const o={};
  CATS.forEach(([k,col,fn,skipNA,skipEmpty])=>{
    const v=r[col];
    if(skipNA&&isNA(v))return;
    if(skipEmpty&&lc(v)==='')return;
    o[k]=!!fn(v);
  });
  return o;
}
const rowFails=r=>Object.values(evalRow(r)).some(x=>!x);

// ── MÉTRICAS ──────────────────────────────────────────────────────
const pct=(ok,tot)=>tot>0?Math.round(ok/tot*100):null;
const shortCargo=s=>String(s||'—').replace('Guardia de Línea','G. Línea').replace('Asistente de Servicio','Asistente').replace('Guardia Taller','G. Taller').replace('Guardia Edificio','G. Edificio').replace('Patrulla / Táctico','Patrulla');
const isDiaria=r=>lc(r[C.TIPO])==='fiscalización diaria'||lc(r[C.TIPO])==='fiscalizacion diaria';
const respOf=r=>isDiaria(r)?r[C.SUP]:(r[C.INSP]||r[C.SUP]);
const shortName=s=>String(s||'').trim().split(/\s+/).slice(-2).join(' ');

function metrics(rows){
  if(!rows.length)return null;
  const byTipo={},byZona={},byCargo={},byDate={},byResp={},cm={};
  CATS.forEach(([k])=>cm[k]=[0,0]);

  rows.forEach(r=>{
    const tipo=isDiaria(r)?'Diaria':'Aleatoria';
    byTipo[tipo]=(byTipo[tipo]||0)+1;
    const z=r[C.ZONA]||'Sin zona';byZona[z]=(byZona[z]||0)+1;
    const cg=shortCargo(r[C.CARGO]);byCargo[cg]=(byCargo[cg]||0)+1;
    const d=rowDate(r);if(d){const k=d.getTime();byDate[k]=(byDate[k]||0)+1;}
    const rs=shortName(respOf(r));if(rs)byResp[rs]=(byResp[rs]||0)+1;
    Object.entries(evalRow(r)).forEach(([k,ok])=>cm[k][ok?0:1]++);
  });

  const cp={};
  Object.entries(cm).forEach(([k,[ok,no]])=>{const p=pct(ok,ok+no);if(p!==null)cp[k]=p;});
  const vals=Object.values(cp);
  const gen=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null;
  const incumpl=Object.entries(cp).map(([k,v])=>[k,100-v]).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return{total:rows.length,byTipo,byZona,byCargo,byDate,byResp,cp,gen,incumpl};
}

// ── RENDER ────────────────────────────────────────────────────────
function render(rows){
  const m=metrics(rows);
  renderKPIs(rows,m);
  renderCharts(m);
  const sorted=[...rows].sort((a,b)=>{
    const da=rowDate(a),db=rowDate(b);
    const ta=da?da.getTime():0,tb=db?db.getTime():0;
    if(ta!==tb)return tb-ta;
    return fmtHora(b[C.HORA]).localeCompare(fmtHora(a[C.HORA]));
  });
  renderTable(sorted.slice(0,15));
}

function renderKPIs(rows,m){
  const g=document.getElementById('kpiGrid');
  const plbl={today:'Hoy',week:'Esta semana',month:'Este mes',all:'Histórico'}[period];
  if(!m){
    const hint=allRows.length&&period!=='all'?` · hay ${allRows.length} registros en total, prueba con <b>Todo</b>`:'';
    g.innerHTML=`<div class="kpi" style="grid-column:1/-1;text-align:center;color:var(--txt2)">Sin datos para ${plbl.toLowerCase()}${hint}</div>`;
    return;
  }
  const gc=m.gen>=85?'c-ok':m.gen>=70?'c-warn':'c-bad';
  const con=rows.filter(rowFails).length;
  g.innerHTML=`
    <div class="kpi"><div class="kpi-lbl">Fiscalizaciones</div><div class="kpi-val c-acc">${m.total}</div><div class="kpi-sub">${plbl}</div></div>
    <div class="kpi"><div class="kpi-lbl">Cumplimiento general</div><div class="kpi-val ${gc}">${m.gen!==null?m.gen+'%':'—'}</div><div class="kpi-sub">Promedio de categorías</div></div>
    <div class="kpi"><div class="kpi-lbl">Con incumplimientos</div><div class="kpi-val ${con>0?'c-bad':'c-ok'}">${con}</div><div class="kpi-sub">${Math.round(con/m.total*100)}% del total</div></div>
    <div class="kpi"><div class="kpi-lbl">Trabajadores únicos</div><div class="kpi-val" style="color:var(--txt)">${new Set(rows.map(r=>r[C.RUT]).filter(Boolean)).size}</div><div class="kpi-sub">${plbl.toLowerCase()}</div></div>`;
}

const sc=()=>({ticks:{color:'#8E97C7',font:{size:11}},grid:{color:'rgba(42,47,85,.7)'},border:{color:'transparent'}});
const base={responsive:true,maintainAspectRatio:false};

function draw(id,canvasId,cfg,hasData){
  if(charts[id]){charts[id].destroy();delete charts[id];}
  const cv=document.getElementById(canvasId),wrap=cv.parentElement;
  wrap.querySelector('.chart-empty')?.remove();
  if(!hasData){
    cv.style.display='none';
    const e=document.createElement('div');e.className='chart-empty';e.textContent='Sin datos';wrap.appendChild(e);
    return;
  }
  cv.style.display='';
  charts[id]=new Chart(cv,cfg);
}

function renderCharts(m){
  const e=m||{byDate:{},byTipo:{},cp:{},byZona:{},byCargo:{},byResp:{},incumpl:[]};

  const de=Object.entries(e.byDate).map(([t,c])=>({d:new Date(+t),c})).sort((a,b)=>a.d-b.d).slice(-30);
  draw('act','cActivity',{type:'line',
    data:{labels:de.map(x=>fmtDate(x.d).slice(0,5)),datasets:[{label:'Fiscalizaciones',data:de.map(x=>x.c),borderColor:'#FF4B2B',backgroundColor:'rgba(255,75,43,.1)',tension:.35,fill:true,pointRadius:3,pointBackgroundColor:'#FF4B2B'}]},
    options:{...base,plugins:{legend:{display:false}},scales:{x:sc(),y:{...sc(),beginAtZero:true,ticks:{...sc().ticks,precision:0}}}}},de.length>0);

  const td=Object.entries(e.byTipo);
  draw('tipo','cTipo',{type:'doughnut',
    data:{labels:td.map(([k])=>k),datasets:[{data:td.map(([,v])=>v),backgroundColor:td.map(([k])=>k==='Diaria'?'#FF4B2B':'#1DB86A'),borderWidth:0,hoverOffset:4}]},
    options:{...base,plugins:{legend:{position:'bottom',labels:{color:'#8E97C7',padding:16,font:{size:12}}}}}},td.length>0);

  const sk=Object.entries(e.cp).sort((a,b)=>a[1]-b[1]);
  draw('cumpl','cCumpl',{type:'bar',
    data:{labels:sk.map(([k])=>k),datasets:[{label:'% Cumplimiento',data:sk.map(([,v])=>v),backgroundColor:sk.map(([,v])=>v>=85?'#1DB86A':v>=70?'#F5A623':'#E83A3A'),borderRadius:6,borderSkipped:false}]},
    options:{...base,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{...sc(),min:0,max:100,ticks:{callback:v=>v+'%',color:'#8E97C7'}},y:sc()}}},sk.length>0);

  const ze=Object.entries(e.byZona).sort((a,b)=>b[1]-a[1]).slice(0,8);
  draw('zona','cZona',{type:'bar',
    data:{labels:ze.map(([k])=>k),datasets:[{data:ze.map(([,v])=>v),backgroundColor:'#FF4B2B',borderRadius:6,borderSkipped:false}]},
    options:{...base,plugins:{legend:{display:false}},scales:{x:sc(),y:{...sc(),beginAtZero:true,ticks:{...sc().ticks,precision:0}}}}},ze.length>0);

  const ce=Object.entries(e.byCargo).sort((a,b)=>b[1]-a[1]);
  draw('cargo','cCargo',{type:'doughnut',
    data:{labels:ce.map(([k])=>k),datasets:[{data:ce.map(([,v])=>v),backgroundColor:['#FF4B2B','#1DB86A','#F5A623','#3B82F6','#8B5CF6','#EC4899','#14B8A6'],borderWidth:0}]},
    options:{...base,plugins:{legend:{position:'right',labels:{color:'#8E97C7',font:{size:11},padding:10}}}}},ce.length>0);

  const re=Object.entries(e.byResp).sort((a,b)=>b[1]-a[1]).slice(0,10);
  draw('resp','cResp',{type:'bar',
    data:{labels:re.map(([k])=>k),datasets:[{data:re.map(([,v])=>v),backgroundColor:'#3B82F6',borderRadius:6,borderSkipped:false}]},
    options:{...base,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{...sc(),beginAtZero:true,ticks:{...sc().ticks,precision:0}},y:sc()}}},re.length>0);

  draw('inc','cIncumpl',{type:'bar',
    data:{labels:e.incumpl.map(([k])=>k),datasets:[{data:e.incumpl.map(([,v])=>v),backgroundColor:'#E83A3A',borderRadius:6,borderSkipped:false}]},
    options:{...base,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{...sc(),min:0,max:100,ticks:{callback:v=>v+'%',color:'#8E97C7'}},y:sc()}}},e.incumpl.length>0);
}

function renderTable(rows){
  const c=document.getElementById('tblContainer');
  if(!rows.length){c.innerHTML='<div class="empty">Sin datos para el período</div>';return;}
  const badge=(v,okFn)=>{
    if(lc(v)==='')return'<span class="b-na">—</span>';
    return okFn(v)?`<span class="b-ok">${esc(v)}</span>`:`<span class="b-no">${esc(v)}</span>`;
  };
  c.innerHTML=`<div class="tbl-wrap"><table>
    <thead><tr><th>Fecha / Hora</th><th>Tipo</th><th>Responsable</th><th>Trabajador</th><th>Cargo</th><th>Zona / Est.</th><th>Uniforme</th><th>Presentación</th><th>Resultado</th><th>GPS</th></tr></thead>
    <tbody>${rows.map(r=>{
      const diaria=isDiaria(r);
      const gd=parseInt(r[C.GD]);
      const gps=isNaN(gd)?'<span class="b-na">—</span>':gd<=300?`<span class="b-ok">✓ ${gd} m</span>`:gd<=600?`<span style="color:var(--ylw);font-weight:600;font-size:12px">⚠ ${gd} m</span>`:`<span class="b-no">✗ ${gd} m</span>`;
      const fails=Object.entries(evalRow(r)).filter(([,ok])=>!ok).map(([k])=>k);
      const res=fails.length?`<span class="b-no" title="${esc(fails.join(', '))}">${fails.length} incumpl.</span>`:'<span class="b-ok">OK</span>';
      return`<tr>
        <td style="white-space:nowrap">${fmtDate(rowDate(r))}<br><small style="color:var(--txt2)">${esc(fmtHora(r[C.HORA]))}</small></td>
        <td><span class="${diaria?'tipo-d':'tipo-a'}">${diaria?'Diaria':'Aleatoria'}</span></td>
        <td style="font-size:12px">${esc(shortName(respOf(r))||'—')}</td>
        <td><div style="font-weight:600;font-size:13px">${esc(String(r[C.NOM]||'—').split(' ').slice(0,3).join(' '))}</div><div style="font-size:11px;color:var(--txt2)">${esc(r[C.RUT])}</div></td>
        <td style="font-size:12px">${esc(shortCargo(r[C.CARGO]))}</td>
        <td style="font-size:12px">${esc(r[C.ZONA]||'—')}<br><small style="color:var(--txt2)">${esc(r[C.EST])}</small></td>
        <td>${badge(r[C.UNIF],R.ok)}</td>
        <td>${badge(r[C.PRES],R.buena)}</td>
        <td>${res}</td>
        <td>${gps}</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

// ── INIT ──────────────────────────────────────────────────────────
Chart.defaults.color='#8E97C7';
Chart.defaults.borderColor='#2A2F55';
Chart.defaults.font.family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif";

async function refresh(){
  document.getElementById('lastUpd').textContent='Actualizando...';
  try{
    allRows=(await fetchData()).filter(r=>Array.isArray(r)&&r.some(c=>c!==''&&c!==null));
    hideBanner();
    // Si no hay nada esta semana pero sí hay histórico, abrir en "Todo"
    if(period==='week'&&allRows.length&&!filter(allRows).length)period='all';
    setPeriod(period);
    document.getElementById('lastUpd').textContent='Actualizado '+new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  }catch(err){
    document.getElementById('lastUpd').textContent='Error al cargar';
    showBanner('⚠️ '+esc(err.message));
    document.getElementById('kpiGrid').innerHTML='<div class="kpi" style="grid-column:1/-1;text-align:center;color:var(--txt2)">No se pudieron cargar los datos</div>';
    console.error(err);
  }
}
refresh();
</script>
</body>
