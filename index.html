<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Serveo · Asistencia MetroSeguridad</title>
<style>
:root {
  --bg:#080c10; --bg2:#0e1318; --bg3:#141c24; --bg4:#1a2530;
  --bd:#1e2d3d; --bd2:#253648;
  --acc:#e85d04; --acc2:#f48c06; --acc3:#faa307;
  --green:#10b981; --red:#ef4444; --yellow:#f59e0b;
  --blue:#3b82f6; --purple:#8b5cf6; --cyan:#06b6d4;
  --tx:#e8edf2; --txm:#64748b; --txd:#334155;
  --r:10px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --head:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}

/* ── LOGIN ─────────────────────────────────────── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 30% 40%,rgba(232,93,4,.12) 0%,transparent 55%),
  radial-gradient(ellipse at 80% 80%,rgba(59,130,246,.06) 0%,transparent 50%),var(--bg);
  padding:20px}
.login-box{background:var(--bg2);border:1px solid var(--bd);border-radius:20px;
  padding:40px 36px;width:100%;max-width:400px;position:relative;overflow:hidden}
.login-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--acc),var(--acc2),var(--acc3))}
.login-logo{font-family:var(--head);font-size:32px;font-weight:800;color:var(--acc);
  letter-spacing:-2px;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--txm);margin-bottom:32px;font-weight:300}
.login-label{font-size:11px;font-weight:600;color:var(--txm);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:6px}
.login-inp{width:100%;background:var(--bg3);border:1px solid var(--bd);border-radius:var(--r);
  color:var(--tx);padding:13px 15px;font-family:var(--font);font-size:15px;outline:none;
  margin-bottom:14px;transition:border-color .2s}
.login-inp:focus{border-color:var(--acc)}
.login-btn{width:100%;background:var(--acc);color:#fff;border:none;border-radius:var(--r);
  padding:14px;font-family:var(--head);font-size:15px;font-weight:700;cursor:pointer;
  letter-spacing:.3px;transition:all .15s;margin-top:8px}
.login-btn:hover{background:var(--acc2)}
.login-btn:active{transform:scale(.98)}
.login-err{color:var(--red);font-size:12px;margin-top:10px;display:none;text-align:center}

/* ── LAYOUT SUPERVISOR (mobile-first) ─────────── */
.sup-wrap{display:none;min-height:100vh;flex-direction:column}
.sup-hdr{background:rgba(14,19,24,.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--bd);padding:14px 18px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.sup-hdr-logo{font-family:var(--head);font-weight:800;font-size:20px;color:var(--acc);letter-spacing:-1px}
.sup-hdr-info{flex:1}
.sup-hdr-name{font-size:13px;font-weight:600;color:var(--tx)}
.sup-hdr-zona{font-size:11px;color:var(--txm)}
.sup-hdr-btn{background:var(--bg3);border:1px solid var(--bd);color:var(--txm);
  padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:var(--font)}

.sup-body{flex:1;padding:16px}

.sup-fecha-bar{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);
  padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.sup-fecha-bar input[type=date]{background:transparent;border:none;color:var(--tx);
  font-family:var(--head);font-size:18px;font-weight:700;outline:none;flex:1;
  color-scheme:dark}
.sup-turno-sel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.turno-btn{flex:1;min-width:70px;padding:9px 6px;border-radius:8px;border:1px solid var(--bd);
  background:var(--bg2);color:var(--txm);font-family:var(--font);font-size:12px;font-weight:600;
  cursor:pointer;text-align:center;transition:all .15s}
.turno-btn.on{background:var(--acc);border-color:var(--acc);color:#fff}

.sup-section{margin-bottom:20px}
.sup-section-title{font-size:11px;font-weight:600;color:var(--txm);text-transform:uppercase;
  letter-spacing:1px;padding:0 4px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sup-section-title::after{content:'';flex:1;height:1px;background:var(--bd)}

.worker-card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);
  padding:14px 16px;margin-bottom:8px;transition:border-color .15s}
.worker-card.registrado{border-color:var(--green);background:rgba(16,185,129,.04)}
.worker-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.worker-cargo{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.cargo-GS{background:rgba(232,93,4,.15);color:var(--acc)}
.cargo-AS{background:rgba(59,130,246,.15);color:var(--blue)}
.cargo-RT{background:rgba(139,92,246,.15);color:var(--purple)}
.worker-nombre{font-size:14px;font-weight:600;color:var(--tx);flex:1;line-height:1.2}
.worker-inst{font-size:11px;color:var(--txm);margin-top:1px}
.worker-estado{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.est-pendiente{background:rgba(100,116,139,.15);color:var(--txm)}
.est-1{background:rgba(16,185,129,.15);color:var(--green)}
.est-F{background:rgba(239,68,68,.15);color:var(--red)}
.est-TE{background:rgba(245,158,11,.15);color:var(--yellow)}
.est-VAC{background:rgba(6,182,212,.15);color:var(--cyan)}
.est-LME{background:rgba(139,92,246,.15);color:var(--purple)}
.est-PSG,.est-PCG{background:rgba(100,116,139,.15);color:var(--txm)}
.est-0{background:rgba(30,45,61,.5);color:var(--txd)}

.inc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.inc-btn{padding:10px 4px;border-radius:8px;border:1px solid var(--bd);
  background:var(--bg3);color:var(--txm);font-family:var(--font);font-size:11px;
  font-weight:600;cursor:pointer;text-align:center;transition:all .15s;line-height:1.3}
.inc-btn:active{transform:scale(.95)}
.inc-btn.on-1{background:rgba(16,185,129,.2);border-color:var(--green);color:var(--green)}
.inc-btn.on-F{background:rgba(239,68,68,.2);border-color:var(--red);color:var(--red)}
.inc-btn.on-TE{background:rgba(245,158,11,.2);border-color:var(--yellow);color:var(--yellow)}
.inc-btn.on-VAC{background:rgba(6,182,212,.2);border-color:var(--cyan);color:var(--cyan)}
.inc-btn.on-LME{background:rgba(139,92,246,.2);border-color:var(--purple);color:var(--purple)}
.inc-btn.on-PSG,.inc-btn.on-PCG{background:rgba(100,116,139,.2);border-color:var(--txm);color:var(--tx)}
.inc-btn.on-0{background:rgba(30,45,61,.5);border-color:var(--bd2);color:var(--txd)}

.sup-submit{position:sticky;bottom:0;padding:16px;background:var(--bg);
  border-top:1px solid var(--bd)}
.sup-submit-btn{width:100%;background:var(--acc);color:#fff;border:none;border-radius:var(--r);
  padding:16px;font-family:var(--head);font-size:16px;font-weight:700;cursor:pointer;
  transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.sup-submit-btn:disabled{opacity:.4;cursor:not-allowed}
.sup-submit-btn:not(:disabled):active{transform:scale(.98)}

.prog-bar{height:3px;background:var(--bd);border-radius:2px;margin-bottom:16px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc3));
  border-radius:2px;transition:width .3s}

/* ── LAYOUT ADMIN ──────────────────────────────── */
.adm-wrap{display:none;min-height:100vh;flex-direction:column}
.adm-hdr{background:rgba(14,19,24,.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--bd);padding:0 24px;height:56px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
.adm-logo{font-family:var(--head);font-weight:800;font-size:20px;color:var(--acc);letter-spacing:-1px}
.adm-sep{width:1px;height:20px;background:var(--bd)}
.adm-title{font-size:13px;color:var(--txm);font-weight:500}
.adm-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.adm-user{font-size:12px;color:var(--txm);background:var(--bg3);padding:5px 12px;
  border-radius:20px;border:1px solid var(--bd)}
.adm-user span{color:var(--acc);font-weight:700}
.adm-btn{background:var(--bg3);border:1px solid var(--bd);color:var(--txm);padding:6px 14px;
  border-radius:8px;font-size:12px;cursor:pointer;font-family:var(--font);transition:all .15s}
.adm-btn:hover{border-color:var(--acc);color:var(--acc)}

.adm-tabs{display:flex;gap:2px;padding:12px 24px 0;border-bottom:1px solid var(--bd);
  background:var(--bg2);overflow-x:auto}
.atab{padding:9px 18px;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px;
  font-weight:600;color:var(--txm);border:1px solid transparent;border-bottom:none;
  transition:all .15s;white-space:nowrap;font-family:var(--font)}
.atab:hover{color:var(--tx);background:var(--bg3)}
.atab.on{color:var(--tx);background:var(--bg);border-color:var(--bd);
  border-bottom:1px solid var(--bg);margin-bottom:-1px}

.adm-body{padding:24px;flex:1}
.apage{display:none}.apage.on{display:block}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);
  padding:18px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi.k-o::after{background:var(--acc)}.kpi.k-g::after{background:var(--green)}
.kpi.k-r::after{background:var(--red)}.kpi.k-y::after{background:var(--yellow)}
.kpi.k-b::after{background:var(--blue)}
.kv{font-family:var(--head);font-size:30px;font-weight:700;line-height:1}
.kl{font-size:10px;color:var(--txm);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}

.filtros{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.filtros select,.filtros input{background:var(--bg2);border:1px solid var(--bd);
  color:var(--tx);padding:9px 12px;border-radius:8px;font-family:var(--font);font-size:13px;
  outline:none;transition:border-color .2s}
.filtros select:focus,.filtros input:focus{border-color:var(--acc)}

.table-wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#0a0e14;color:var(--txm);text-transform:uppercase;letter-spacing:.8px;
  font-size:10px;padding:11px 14px;text-align:left;border-bottom:1px solid var(--bd);
  white-space:nowrap;font-family:var(--font)}
td{padding:10px 14px;border-bottom:1px solid #141c24;color:var(--tx);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:#0e1820}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.3px}
.badge-1{background:rgba(16,185,129,.15);color:var(--green)}
.badge-F{background:rgba(239,68,68,.15);color:var(--red)}
.badge-TE{background:rgba(245,158,11,.15);color:var(--yellow)}
.badge-VAC{background:rgba(6,182,212,.15);color:var(--cyan)}
.badge-LME{background:rgba(139,92,246,.15);color:var(--purple)}
.badge-PSG,.badge-PCG{background:rgba(100,116,139,.15);color:var(--txm)}
.badge-0{background:rgba(30,45,61,.5);color:var(--txd)}

.sync-bar{display:flex;align-items:center;gap:10px;background:var(--bg2);
  border:1px solid var(--bd);border-radius:8px;padding:10px 16px;margin-bottom:20px;font-size:13px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);
  animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sync-txt{color:var(--txm)}
.sync-btn{margin-left:auto;background:var(--bg3);border:1px solid var(--bd);
  color:var(--txm);padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;
  font-family:var(--font);transition:all .15s}
.sync-btn:hover{border-color:var(--acc);color:var(--acc)}

.empty-state{text-align:center;padding:48px;color:var(--txm);font-size:13px}
.empty-icon{font-size:36px;margin-bottom:12px;opacity:.4}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1a2530;border:1px solid var(--bd2);color:var(--tx);padding:12px 20px;
  border-radius:10px;font-size:13px;font-weight:500;z-index:9999;opacity:0;
  transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;
  color:var(--txm);font-size:13px;gap:10px}
.spin{width:16px;height:16px;border:2px solid var(--bd2);border-top-color:var(--acc);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* NOMINA PANEL */
.nom-card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);
  padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.nom-info{flex:1}
.nom-nombre{font-size:14px;font-weight:600}
.nom-meta{font-size:11px;color:var(--txm);margin-top:2px}
.nom-badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700}
.nom-add-btn{background:var(--acc);color:#fff;border:none;border-radius:8px;
  padding:10px 16px;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:16px}
.nom-form{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);
  padding:20px;margin-bottom:20px;display:none}
.nom-form.show{display:block}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:500px){.form-grid{grid-template-columns:1fr}}
.form-inp{width:100%;background:var(--bg3);border:1px solid var(--bd);border-radius:8px;
  color:var(--tx);padding:10px 12px;font-family:var(--font);font-size:13px;outline:none}
.form-inp:focus{border-color:var(--acc)}
.form-label{font-size:11px;color:var(--txm);margin-bottom:4px;display:block;
  text-transform:uppercase;letter-spacing:.5px}

/* DOTACIÓN */
.dotacion-wrap{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--r);
  padding:14px;margin-bottom:16px}
.dotacion-turno{margin-bottom:10px}
.dotacion-turno:last-child{margin-bottom:0}
.dotacion-turno-title{font-size:10px;font-weight:700;color:var(--txm);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:6px}
.dotacion-row{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;margin-bottom:4px}
.dot-ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2)}
.dot-parcial{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2)}
.dot-cero{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15)}
.dot-counter{font-family:var(--mono);font-size:15px;font-weight:700;min-width:36px}
.dot-ok .dot-counter{color:var(--green)}
.dot-parcial .dot-counter{color:var(--yellow)}
.dot-cero .dot-counter{color:var(--red)}
.dot-cargo{font-size:12px;color:var(--tx)}
.dot-section-title{font-size:12px;font-weight:700;color:var(--txm);text-transform:uppercase;
  letter-spacing:1px;margin:16px 0 8px;padding:0 4px;display:flex;align-items:center;gap:8px}
.dot-section-title::after{content:'';flex:1;height:1px;background:var(--bd)}

/* SLOTS DE PUESTO */
.puesto-block{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);
  margin-bottom:8px;overflow:hidden}
.puesto-header{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--bd)}
.puesto-counter{font-family:var(--head);font-size:16px;font-weight:700;min-width:38px}
.puesto-ok .puesto-counter{color:var(--green)}
.puesto-parcial .puesto-counter{color:var(--yellow)}
.puesto-cero .puesto-counter{color:var(--red)}
.puesto-ok{border-left:3px solid var(--green)}
.puesto-parcial{border-left:3px solid var(--yellow)}
.puesto-cero{border-left:3px solid var(--red)}
.puesto-cargo-label{font-size:12px;font-weight:600;color:var(--tx);flex:1}
.puesto-turno-tag{font-size:10px;color:var(--txm);background:var(--bg3);padding:2px 8px;
  border-radius:20px;border:1px solid var(--bd)}

.slot-list{padding:8px 14px;display:flex;flex-direction:column;gap:6px}
.slot-item{display:flex;align-items:center;gap:8px;padding:8px 10px;
  border-radius:8px;background:var(--bg3);border:1px solid var(--bd)}
.slot-item.slot-asignado{background:rgba(16,185,129,.05);border-color:rgba(16,185,129,.25)}
.slot-item.slot-falta{background:rgba(239,68,68,.05);border-color:rgba(239,68,68,.2)}
.slot-item.slot-otro{background:rgba(245,158,11,.05);border-color:rgba(245,158,11,.2)}
.slot-num{font-size:10px;color:var(--txm);min-width:16px;text-align:center;font-weight:700}
.slot-nombre{flex:1;font-size:13px;font-weight:600;color:var(--tx)}
.slot-nombre.vacio{color:var(--txm);font-weight:400;font-style:italic}
.slot-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.slot-badge-1{background:rgba(16,185,129,.2);color:var(--green)}
.slot-badge-F{background:rgba(239,68,68,.2);color:var(--red)}
.slot-badge-TE{background:rgba(245,158,11,.2);color:var(--yellow)}
.slot-badge-VAC{background:rgba(6,182,212,.2);color:var(--cyan)}
.slot-badge-LME{background:rgba(139,92,246,.2);color:var(--purple)}
.slot-badge-PSG,.slot-badge-PCG{background:rgba(100,116,139,.2);color:var(--txm)}
.slot-badge-0{background:rgba(30,45,61,.5);color:var(--txd)}
.slot-asignar-btn{background:var(--acc);border:none;color:#fff;padding:5px 11px;
  border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font);
  white-space:nowrap}
.slot-quitar-btn{background:none;border:none;color:var(--txd);font-size:13px;
  cursor:pointer;padding:4px 6px;border-radius:4px;transition:color .15s;line-height:1}
.slot-quitar-btn:hover{color:var(--red)}
.slot-asignar-btn.cambiar{background:var(--bg4);border:1px solid var(--bd);color:var(--txm)}

/* PANEL TURNO EXTRA */
.te-panel{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.2);
  border-radius:8px;padding:10px 14px;margin-top:6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.te-panel-label{font-size:11px;font-weight:700;color:var(--yellow);text-transform:uppercase;
  letter-spacing:.5px;width:100%}
.te-tipo-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--bd);
  background:var(--bg3);color:var(--txm);font-size:12px;font-weight:600;cursor:pointer;
  font-family:var(--font);transition:all .15s}
.te-tipo-btn.on{background:rgba(245,158,11,.2);border-color:var(--yellow);color:var(--yellow)}
.te-select{background:var(--bg3);border:1px solid var(--bd);border-radius:6px;
  color:var(--tx);padding:6px 10px;font-family:var(--font);font-size:13px;outline:none;
  min-width:120px}
.te-select:focus{border-color:var(--yellow)}
.slot-estado-btns{display:flex;gap:4px;flex-wrap:wrap}
.slot-est-btn{padding:4px 9px;border-radius:6px;border:1px solid var(--bd);
  background:var(--bg3);color:var(--txm);font-size:10px;font-weight:700;cursor:pointer;
  font-family:var(--font);transition:all .1s}
.slot-est-btn:active{transform:scale(.95)}

/* MODAL ASIGNAR */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;
  display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:var(--bg2);border:1px solid var(--bd);border-radius:16px 16px 0 0;
  width:100%;max-width:500px;padding:20px;max-height:80vh;display:flex;flex-direction:column}
.modal-title{font-family:var(--head);font-size:16px;font-weight:700;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--txm);margin-bottom:16px}
.modal-search{width:100%;background:var(--bg3);border:1px solid var(--bd);border-radius:8px;
  color:var(--tx);padding:11px 14px;font-family:var(--font);font-size:14px;outline:none;
  margin-bottom:12px}
.modal-search:focus{border-color:var(--acc)}
.modal-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.modal-item{padding:10px 12px;border-radius:8px;border:1px solid var(--bd);
  background:var(--bg3);cursor:pointer;transition:all .1s}
.modal-item:active{background:var(--bg4)}
.modal-item-nombre{font-size:13px;font-weight:600}
.modal-item-meta{font-size:11px;color:var(--txm);margin-top:2px}
.modal-close{margin-top:12px;width:100%;background:var(--bg3);border:1px solid var(--bd);
  color:var(--txm);padding:11px;border-radius:8px;cursor:pointer;font-family:var(--font);font-size:13px}
/* PANTALLA ESTACIONES */
.est-grid{display:flex;flex-direction:column;gap:10px;padding:4px 0}
.est-card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);
  padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;
  transition:all .15s;position:relative;overflow:hidden}
.est-card:active{transform:scale(.98)}
.est-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.est-card.est-ok::before{background:var(--green)}
.est-card.est-parcial::before{background:var(--yellow)}
.est-card.est-cero::before{background:var(--red)}
.est-card.est-vacio::before{background:var(--bd)}
.est-sigla{width:40px;height:40px;border-radius:10px;background:var(--bg3);
  border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;
  font-family:var(--head);font-size:13px;font-weight:800;color:var(--acc);flex-shrink:0}
.est-info{flex:1;min-width:0}
.est-nombre{font-size:14px;font-weight:600;color:var(--tx)}
.est-meta{font-size:11px;color:var(--txm);margin-top:2px}
.est-counter{font-family:var(--head);font-size:18px;font-weight:700;flex-shrink:0}
.est-ok .est-counter{color:var(--green)}
.est-parcial .est-counter{color:var(--yellow)}
.est-cero .est-counter{color:var(--red)}
.est-vacio .est-counter{color:var(--txd)}
.est-chevron{color:var(--txd);font-size:18px;flex-shrink:0}

/* HEADER ESTACIÓN (vista detalle) */
.est-detalle-hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px;
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:12px 16px}
.est-back-btn{background:var(--bg3);border:1px solid var(--bd);color:var(--txm);
  padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-family:var(--font);
  transition:all .15s;white-space:nowrap}
.est-back-btn:hover{border-color:var(--acc);color:var(--acc)}
.est-detalle-nombre{font-family:var(--head);font-size:16px;font-weight:700;flex:1}

function slotKey(siglaInst, turno, cargo, idx) {
  return `${siglaInst}|${turno}|${cargo}|${idx}`;
}

function safeId(key) {
  // Convierte slotKey en ID válido para el DOM: reemplaza |, espacios y caracteres especiales
  return key.replace(/[|\s\/áéíóúñÁÉÍÓÚÑ]/g, c => {
    const m = {'|':'-',' ':'-','/':'-','á':'a','é':'e','í':'i','ó':'o','ú':'u','ñ':'n',
               'Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U','Ñ':'N'};
    return m[c] || '-';
  });
}

function renderDotacion(siglaInst, fecha) {
  const tipo = getTipoDia(fecha);
  const reqs = REQUERIMIENTO[siglaInst] && REQUERIMIENTO[siglaInst][tipo];
  if (!reqs || !reqs.length) return '';

  // Agrupar por turno
  const porTurno = {};
  reqs.forEach(r => {
    if (!porTurno[r.turno]) porTurno[r.turno] = [];
    porTurno[r.turno].push(r);
  });

  // Filtrar solo los turnos que corresponden al tab seleccionado
  const turnosFiltrados = Object.entries(porTurno).filter(([turno]) =>
    turnoMatchReq(turno, turnoSeleccionado)
  );

  if (turnosFiltrados.length === 0) return '';

  let html = '';
  turnosFiltrados.forEach(([turno, items]) => {
    html += `<div class="dot-section-title">${turno}</div>`;
    items.forEach(r => {
      html += renderPuestoBlock(siglaInst, turno, r.cargo, r.requerido);
    });
  });
  return html;
}

function turnoMatchReq(turnoReq, tabSel) {
  const t = turnoReq.toLowerCase();
  const mapa = {
    't1': ['largo t1','corto t1','largo t-1','corto t-1','revisión tren t1','revision tren t1',
           'refuerzo t1','intermedio t1','ggss piloto apertura','gs corto 1 piloto',
           'ggss intermedio piloto','ref. pda ct1','ref. pda intermedio','ref. pda t1'],
    't2': ['largo t2','corto t2','largo t-2','corto t-2','revisión tren t2','revision tren t2',
           'ref. pda ct2','ref. pda t2','corto t2 vespertino'],
    't3': ['noche t3','turno noche','noche','ggss cierre piloto'],
  };
  const palabras = mapa[tabSel.toLowerCase()] || [];
  return palabras.some(p => t.includes(p));
}

function renderTEPanel(rut) {
  const info = extraInfo[rut] || {};

  const btnHoras = `<button class="te-tipo-btn ${tipo==='horas'?'on':''}"
    data-te-rut="${rut}" data-te-tipo="horas">⏱ Horas Extra</button>`;
  const btnBono = `<button class="te-tipo-btn ${tipo==='bono'?'on':''}"
    data-te-rut="${rut}" data-te-tipo="bono">💰 Bono</button>`;

  let selectHtml = '';
  if (tipo === 'horas') {
    const opts = Array.from({length:12},(_,i)=>i+1).map(h =>
      `<option value="${h}" ${info.horas==h?'selected':''}>${h} hora${h>1?'s':''}</option>`
    ).join('');
    selectHtml = `<select class="te-select" data-te-rut="${rut}" data-te-campo="horas">
      <option value="">— Horas —</option>${opts}</select>`;
  } else if (tipo === 'bono') {
    const montos = [25000,35000,50000];
    const opts = montos.map(m =>
      `<option value="${m}" ${info.monto==m?'selected':''}>${m.toLocaleString('es-CL')} CLP</option>`
    ).join('');
    selectHtml = `<select class="te-select" data-te-rut="${rut}" data-te-campo="monto">
      <option value="">— Monto —</option>${opts}

    ${info.monto==='otro' ? `<input class="te-select" type="number" placeholder="Monto $"
      data-te-rut="${rut}" data-te-campo="monto_custom"
      value="${info.monto_custom||''}" style="width:130px">` : ''}`;
  }

  return `<div class="te-panel">
    <div class="te-panel-label">⚡ Turno Extra — Selecciona tipo</div>
    ${btnHoras}${btnBono}
    ${selectHtml}
  </div>`;
}

// Códigos que requieren reemplazo
const ESTADOS_AUSENCIA = ['F','VAC','LME','PSG','PCG'];

function renderPuestoBlock(siglaInst, turno, cargo, requerido) {
  let cubiertos = 0;
  let slotsHtml = '';

  for (let i = 0; i < requerido; i++) {
    const key = slotKey(siglaInst, turno, cargo, i);
    const asig = asignacionesPuesto[key];
    const safeKey = key.replace(/'/g,"\\'");

    if (asig) {
      const esDescubierto = asig.rut === '__DESCUBIERTO__';
      const cod = esDescubierto ? 'F' : registrosHoy[asig.rut];
      if (cod === '1' || cod === 'TE') cubiertos++;
      const clsItem = esDescubierto ? 'slot-falta'
                    : cod === '1' || cod === 'TE' ? 'slot-asignado'
                    : cod === 'F' ? 'slot-falta' : cod ? 'slot-otro' : '';
      const badgeHtml = esDescubierto
        ? `<span class="slot-badge slot-badge-F" style="background:rgba(239,68,68,.25)">Descubierto</span>`
        : cod
          ? `<span class="slot-badge slot-badge-${cod}">${INC_LABELS[cod]||cod}</span>`
          : `<span class="slot-badge" style="background:rgba(100,116,139,.1);color:var(--txm)">Sin estado</span>`;

      const estBtns = esDescubierto ? '' : ['1','F','TE','HD','VAC','LME','0'].map(c =>
        `<button class="slot-est-btn ${cod===c?'on-'+c:''}"
          data-key="${safeKey}" data-rut="${asig.rut}" data-cod="${c}"
          style="${cod===c ? getEstColor(c) : ''}"
          title="${INC_LABELS[c]||c}">${getEstEmoji(c)}</button>`
      ).join('');

      // Titular
      slotsHtml += `
        <div class="slot-item ${clsItem}" id="slot-${safeId(key)}">
          <span class="slot-num" style="color:var(--txm);font-size:9px">TITULAR</span>
          <div style="flex:1;min-width:0">
            <div class="slot-nombre">${formatNombreCorto(asig.nombre)}</div>
            <div style="font-size:10px;color:var(--txm);margin-top:1px">${asig.instalacionReal||''}</div>
          </div>
          ${badgeHtml}
          <div class="slot-estado-btns">${estBtns}</div>
          <button class="slot-asignar-btn cambiar"
            data-modal-key="${safeKey}" data-modal-turno="${turno}" data-modal-cargo="${cargo}"
            title="Cambiar">↺</button>
          <button class="slot-quitar-btn"
            data-quitar-key="${safeKey}" title="Quitar">✕</button>
        </div>
        ${!esDescubierto && cod === 'TE' ? renderTEPanel(asig.rut) : ''}
        ${!esDescubierto && cod === 'HD' ? renderHDPanel(asig.rut) : ''}`;

      // Slot de reemplazo si el titular está ausente (no aplica para puesto descubierto)
      if (!esDescubierto && ESTADOS_AUSENCIA.includes(cod)) {
        const replKey = slotKey(siglaInst, turno, cargo, `repl-${i}`);
        const safeReplKey = replKey.replace(/'/g,"\\'");
        const replAsig = asignacionesPuesto[replKey];

        if (replAsig) {
          const replCod = registrosHoy[replAsig.rut];
          if (replCod === '1' || replCod === 'TE') cubiertos++;
          const replCls = replCod === '1' || replCod === 'TE' ? 'slot-asignado' : replCod === 'F' ? 'slot-falta' : replCod ? 'slot-otro' : '';
          const replBadge = replCod
            ? `<span class="slot-badge slot-badge-${replCod}">${INC_LABELS[replCod]||replCod}</span>`
            : `<span class="slot-badge" style="background:rgba(100,116,139,.1);color:var(--txm)">Sin estado</span>`;
          const replEstBtns = ['1','F','TE','HD','VAC','LME','0'].map(c =>
            `<button class="slot-est-btn ${replCod===c?'on-'+c:''}"
              data-key="${safeReplKey}" data-rut="${replAsig.rut}" data-cod="${c}"
              style="${replCod===c ? getEstColor(c) : ''}"
              title="${INC_LABELS[c]||c}">${getEstEmoji(c)}</button>`
          ).join('');

          slotsHtml += `
            <div class="slot-item ${replCls}" id="slot-${safeId(replKey)}"
              style="border-left:3px solid var(--acc);margin-left:12px">
              <span class="slot-num" style="color:var(--acc);font-size:9px">REEMPLAZO</span>
              <div style="flex:1;min-width:0">
                <div class="slot-nombre">${formatNombreCorto(replAsig.nombre)}</div>
                <div style="font-size:10px;color:var(--txm);margin-top:1px">${replAsig.instalacionReal||''}</div>
              </div>
              ${replBadge}
              <div class="slot-estado-btns">${replEstBtns}</div>
              <button class="slot-asignar-btn cambiar"
                data-modal-key="${safeReplKey}" data-modal-turno="${turno}" data-modal-cargo="${cargo}"
                title="Cambiar">↺</button>
              <button class="slot-quitar-btn"
                data-quitar-key="${safeReplKey}" title="Quitar">✕</button>
            </div>
            ${replCod === 'TE' ? renderTEPanel(replAsig.rut) : ''}
            ${replCod === 'HD' ? renderHDPanel(replAsig.rut) : ''}`;
        } else {
          slotsHtml += `
            <div class="slot-item" id="slot-${safeId(replKey)}"
              style="border-left:3px solid var(--acc);margin-left:12px;border-color:rgba(232,93,4,.3)">
              <span class="slot-num" style="color:var(--acc);font-size:9px">REEMPLAZO</span>
              <span class="slot-nombre vacio">— Sin reemplazo</span>
              <button class="slot-asignar-btn"
                data-modal-key="${safeReplKey}" data-modal-turno="${turno}" data-modal-cargo="${cargo}">+ Asignar reemplazo</button>
            </div>`;
        }
      }

    } else {
      slotsHtml += `
        <div class="slot-item" id="slot-${safeId(key)}">
          <span class="slot-num" style="color:var(--txm);font-size:9px">TITULAR</span>
          <span class="slot-nombre vacio">— Sin asignar</span>
          <button class="slot-asignar-btn"
            data-modal-key="${safeKey}" data-modal-turno="${turno}" data-modal-cargo="${cargo}">+ Asignar</button>
        </div>`;
    }
  }

  const cls = cubiertos >= requerido ? 'puesto-ok' : cubiertos > 0 ? 'puesto-parcial' : 'puesto-cero';
  const pblockId = `pblock-${safeId(slotKey(siglaInst,turno,cargo,0))}`;
  return `
    <div class="puesto-block ${cls}" id="${pblockId}">
      <div class="puesto-header">
        <span class="puesto-counter">${cubiertos}/${requerido}</span>
        <span class="puesto-cargo-label">${cargo}</span>
      </div>
      <div class="slot-list">${slotsHtml}</div>
    </div>`;
}

function renderHDPanel(rut) {

function formatNombreCorto(n) {
  if (!n) return '';
  const p = n.trim().split(/\s+/);
  if (p.length <= 2) return n;
  return p[0] + ' ' + p[1];
}

function getRequeridoCount(siglaInst, turno, cargo) {
  const fecha = document.getElementById('sup-fecha').value;
  const tipo = getTipoDia(fecha);
  const reqs = REQUERIMIENTO[siglaInst] && REQUERIMIENTO[siglaInst][tipo];
  if (!reqs) return 1;
  const r = reqs.find(r => r.turno === turno && r.cargo === cargo);
  return r ? r.requerido : 1;
}

let modalContextKey = null;
let modalContextTurno = null;
let modalContextCargo = null;

function abrirModal(key, turno, cargo) {
  modalContextKey = key;
  modalContextTurno = turno;
  modalContextCargo = cargo;
  document.getElementById('modal-titulo').textContent = `Asignar: ${cargo}`;
  document.getElementById('modal-subtitulo').textContent = turno;
  document.getElementById('modal-buscar').value = '';
  filtrarModal();
  document.getElementById('modal-asignar').classList.add('show');
  setTimeout(() => document.getElementById('modal-buscar').focus(), 100);
}

function cerrarModal() {
  document.getElementById('modal-asignar').classList.remove('show');
  modalContextKey = null;
}

function filtrarModal() {
  const q = document.getElementById('modal-buscar').value.toLowerCase();
  const lista = empleados.filter(e =>
    !q || e.nombre.toLowerCase().includes(q) || e.rut.toLowerCase().includes(q)
  ).slice(0, 30);

  const ul = document.getElementById('modal-lista');

  // Opción fija: Puesto descubierto (siempre visible arriba)
  const descubierto = !q ? `
    <div class="modal-item" onclick="asignarDescubierto()"
      style="border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.05)">
      <div class="modal-item-nombre" style="color:var(--red)">⛔ Puesto descubierto</div>
      <div class="modal-item-meta">Registrar que el puesto no fue cubierto</div>
    </div>` : '';

  if (lista.length === 0 && !descubierto) {
    ul.innerHTML = '<div class="empty-state" style="padding:20px">No se encontraron trabajadores</div>';
    return;
  }
  ul.innerHTML = descubierto + lista.map(e => `
    <div class="modal-item" onclick="asignarDesdeModal('${e.rut}')">
      <div class="modal-item-nombre">${e.nombre}</div>
      <div class="modal-item-meta">${e.rut} · ${e.cargo} · ${e.instalacion} (${e.zona})</div>
    </div>`).join('');
}

function asignarDescubierto() {
  if (!modalContextKey) return;
  // Usar un RUT especial para puesto descubierto
  asignacionesPuesto[modalContextKey] = {
    rut: '__DESCUBIERTO__',
    nombre: 'PUESTO DESCUBIERTO',
    cargo: '',
    instalacionReal: ''
  };
  registrosHoy['__DESCUBIERTO__'] = 'F'; // estado Falta por defecto
  cerrarModal();
  renderWorkers();
  actualizarProgreso();
  toast('⛔ Puesto marcado como descubierto');
}

function asignarDesdeModal(rut) {
  const emp = empleados.find(e => e.rut === rut);
  if (!emp || !modalContextKey) return;
  asignacionesPuesto[modalContextKey] = {
    rut: emp.rut,
    nombre: emp.nombre,
    cargo: emp.cargo,
    instalacionReal: emp.instalacion
  };
  cerrarModal();
  renderWorkers();
  actualizarProgreso();
  toast(`✅ ${formatNombreCorto(emp.nombre)} asignado`);
}

function cargoAbrev(cargo) {
  if (!cargo) return 'GS';
  if (cargo.toLowerCase().includes('guardia')) return 'GS';
  if (cargo.toLowerCase().includes('andén') || cargo.toLowerCase().includes('anden')) return 'AS';
  if (cargo.toLowerCase().includes('servicio')) return 'AS';
  if (cargo.toLowerCase().includes('cliente')) return 'AS';
  if (cargo.toLowerCase().includes('revision') || cargo.toLowerCase().includes('revisión')) return 'RT';
  if (cargo.toLowerCase().includes('supervisor')) return 'SUP';
  return 'GS';
}

function turnoMatch(turnoEmp, turnoSel) {
  if (!turnoSel) return true;
  const t = (turnoEmp || "").toLowerCase();
  const s = turnoSel.toLowerCase();
  const mapa = {
    "t1":    ["t-1","t1","largo t-1","corto t-1","turno 1","noche"],
    "t2":    ["t-2","t2","largo t-2","corto t-2","turno 2"],
    "t3":    ["t-3","t3","largo t-3","corto t-3","turno 3"],
    "t1-t2": ["t-1","t1","t-2","t2","largo t-1","largo t-2","corto t-1","corto t-2","noche"],
    "t2-t3": ["t-2","t2","t-3","t3","largo t-2","largo t-3","corto t-2","corto t-3"],
  };
  const palabras = mapa[s] || [];
  return palabras.some(p => t.includes(p));
}

// Mapa inverso sigla → nombre display
function getSiglaANombre() {
  const m = {};
  Object.entries(INST_SIGLA).forEach(([nombre, sigla]) => {
    if (!m[sigla]) m[sigla] = nombre;
  });
  return m;
}

// Calcular cobertura total de una estación (todos los turnos del día)
function getCoberturaEstacion(sigla, fecha) {
  const tipo = getTipoDia(fecha);
  const reqs = REQUERIMIENTO[sigla] && REQUERIMIENTO[sigla][tipo];
  if (!reqs || !reqs.length) return {total:0, cubiertos:0};
  let total = 0, cubiertos = 0;
  reqs.forEach(r => {
    total += r.requerido;
    for (let i = 0; i < r.requerido; i++) {
      const key = slotKey(sigla, r.turno, r.cargo, i);
      const asig = asignacionesPuesto[key];
      if (asig && asig.rut !== '__DESCUBIERTO__') {
        const cod = registrosHoy[asig.rut];
        if (cod === '1' || cod === 'TE') cubiertos++;
      }
      const replKey = slotKey(sigla, r.turno, r.cargo, `repl-${i}`);
      const replAsig = asignacionesPuesto[replKey];
      if (replAsig) {
        const replCod = registrosHoy[replAsig.rut];
        if (replCod === '1' || replCod === 'TE') cubiertos++;
      }
    }
  });
  return {total, cubiertos};
}

function renderEstaciones() {
  const grid = document.getElementById('est-grid');
  if (!grid) return;
  const fecha = document.getElementById('sup-fecha').value;
  if (!fecha) return;
  const siglaANombre = getSiglaANombre();
  const siglas = Object.keys(REQUERIMIENTO); // orden fijo según definición
  grid.innerHTML = siglas.map(sigla => {
    const nombre = siglaANombre[sigla] || sigla;
    const {total, cubiertos} = getCoberturaEstacion(sigla, fecha);
    const cls = total === 0 ? 'est-vacio'
              : cubiertos >= total ? 'est-ok'
              : cubiertos > 0 ? 'est-parcial' : 'est-cero';
    const counterTxt = total === 0 ? '—' : `${cubiertos}/${total}`;
    return `<div class="est-card ${cls}" onclick="abrirEstacion('${sigla}')">
      <div class="est-sigla">${sigla}</div>
      <div class="est-info">
        <div class="est-nombre">${nombre}</div>
        <div class="est-meta">${total === 0 ? 'Sin requerimiento' : 'puestos cubiertos'}</div>
      </div>
      <div class="est-counter">${counterTxt}</div>
      <div class="est-chevron">›</div>
    </div>`;
  }).join('');
}

function abrirEstacion(sigla) {
  estacionActiva = sigla;
  const siglaANombre = getSiglaANombre();
  document.getElementById('est-detalle-nombre').textContent = siglaANombre[sigla] || sigla;
  document.getElementById('sup-estaciones').style.display = 'none';
  document.getElementById('sup-detalle').style.display = 'block';
  document.getElementById('sup-submit-bar').style.display = 'block';

function volverEstaciones() {

function renderWorkers() {
  const cont = document.getElementById('sup-workers-container');
  cont.innerHTML = '';
  if (!estacionActiva) { renderEstaciones(); return; }
  const fecha = document.getElementById('sup-fecha').value;
  const dotHtml = renderDotacion(estacionActiva, fecha);
  if (!dotHtml) {
    cont.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div>No hay requerimientos para este turno</div>';
  } else {
    cont.innerHTML = dotHtml;
  }
  actualizarProgreso();
}


function setIncidencia(rut, cod) {
  // Para instalaciones sin requerimiento (modo simple)
  registrosHoy[rut] = cod;
  const cardId = 'card-' + rut.replace(/[^a-z0-9]/gi,'');
  const card = document.getElementById(cardId);
  if (!card) return;
  const zona = usuarioActual.zona;
  const w = empleados.find(e => e.rut === rut);
  if (!w) return;
  const abrev = cargoAbrev(w.cargo);
  card.className = 'worker-card registrado';
  let incBtns = INCIDENCIAS.map(inc => `
    <button class="inc-btn ${cod === inc.cod ? 'on-'+inc.cod : ''}"
      onclick="setIncidencia('${rut}','${inc.cod}')">
      ${inc.emoji}<br>${inc.desc}
    </button>`).join('');
  card.innerHTML = `
    <div class="worker-top">
      <div class="worker-cargo cargo-${abrev}">${abrev}</div>
      <div style="flex:1">
        <div class="worker-nombre">${w.nombre}</div>
        <div class="worker-inst">${w.turno || ''}</div>
      </div>
      <div class="worker-estado est-${cod}">${INC_LABELS[cod] || cod}</div>
    </div>
    <div class="inc-grid">${incBtns}</div>`;
  actualizarProgreso();
}

function actualizarProgreso() {
  // Contar slots asignados con estado
  const totalSlots = Object.keys(asignacionesPuesto).length;
  const conEstado  = Object.values(asignacionesPuesto).filter(a => registrosHoy[a.rut]).length;
  // También contar workers en modo simple
  const zona = usuarioActual ? usuarioActual.zona : null;
  const simples = zona ? empleados.filter(e => e.zona === zona &&
    !Object.values(asignacionesPuesto).find(a => a.rut === e.rut)).length : 0;
  const simplesConEst = simples > 0 ?
    Object.keys(registrosHoy).filter(rut =>
      !Object.values(asignacionesPuesto).find(a => a.rut === rut)).length : 0;

  const total = totalSlots + simples;
  const registrados = conEstado + simplesConEst;
  const pct = total > 0 ? Math.round((registrados / total) * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('sup-enviar-txt').textContent =
    `Enviar asistencia (${registrados}/${total})`;
}

async function enviarAsistencia() {
  const fecha = document.getElementById('sup-fecha').value;

  // Construir registros desde asignacionesPuesto
  const registros = Object.entries(asignacionesPuesto).map(([key, asig]) => {
    const partes = key.split('|');
    const turnoReq = partes[1], cargoReq = partes[2];
    const emp = empleados.find(e => e.rut === asig.rut);
    const ex = extraInfo[asig.rut] || {};
    return {
      fecha,
      zona: emp ? emp.zona : '',
      turno: turnoReq,
      instalacion: asig.instalacionReal || (emp ? emp.instalacion : ''),
      cargo: asig.cargo,
      nombre: asig.nombre,
      rut: asig.rut,
      estado: registrosHoy[asig.rut] || 'PENDIENTE',
      supervisor: usuarioActual.nombre,
      puesto_requerido: cargoReq,
      te_tipo: ex.tipo || '',
      te_horas: ex.horas || '',
      te_monto: ex.monto === 'otro' ? (ex.monto_custom || '') : (ex.monto || ''),
      hd_horas: ex.hd_horas || '',
    };
  });

  // Agregar workers en modo simple (sin requerimiento configurado)
  const zona = usuarioActual.zona;
  const rutsEnSlots = new Set(Object.values(asignacionesPuesto).map(a => a.rut));
  empleados.filter(e => e.zona === zona && !rutsEnSlots.has(e.rut) && registrosHoy[e.rut])
    .forEach(w => registros.push({
      fecha, zona: w.zona, turno: turnoSeleccionado,
      instalacion: w.instalacion, cargo: w.cargo,
      nombre: w.nombre, rut: w.rut,
      estado: registrosHoy[w.rut],
      supervisor: usuarioActual.nombre,
    }));

  const sinEstado = registros.filter(r => r.estado === 'PENDIENTE').length;
  if (sinEstado > 0) {
    if (!confirm(`Hay ${sinEstado} slots sin estado. ¿Enviar de todas formas?`)) return;
  }

  const btn = document.getElementById('sup-enviar-btn');
  btn.disabled = true;
  document.getElementById('sup-enviar-txt').textContent = 'Enviando...';

  let ok = 0;
  for (const r of registros) {
    try {
      await fetch(GS_URL, {method:'POST', body:JSON.stringify(r),
        headers:{'Content-Type':'application/json'}});
      ok++;
    } catch(e) {}
  }

  btn.disabled = false;
  actualizarProgreso();

  if (ok === registros.length) {
    toast(`✅ ${ok} registros enviados`);
    registrosHoy = {};
    asignacionesPuesto = {};
    renderWorkers();
  } else {
    toast(`⚠ ${ok}/${registros.length} enviados. Revisa tu conexión.`);
  }
}

function actualizarDiaSemana() {
  const fecha = document.getElementById('sup-fecha').value;
  if (!fecha) return;
  const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const d = new Date(fecha + 'T12:00:00');
  const nombreDia = dias[d.getDay()];
  const tipo = getTipoDia(fecha);
  const esFeriado = FERIADOS.has(fecha);
  const tag = esFeriado ? ' · 🎉 Feriado' : tipo === 'domingo_festivo' ? '' : '';
  document.getElementById('sup-dia-semana').textContent = nombreDia + tag;
}

    });
    initLogin();
  } catch(e) { console.error('arrancar error:', e); }
}
document.addEventListener('DOMContentLoaded', arrancar);
window.addEventListener('load', function() {
  const sel = document.getElementById('login-user');
  if (sel && sel.options.length === 0) arrancar();
});
// ══════════════════════════════════════════════════════════════════
// VISTA ADMIN
function showTab(id) {
  document.querySelectorAll('.apage').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.atab').forEach(t => t.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  event.target.classList.add('on');
}

async function cargarDatos() {
  document.getElementById('sync-txt').textContent = 'Actualizando...';
  try {
    const res = await fetch(GS_URL);
    const json = await res.json();
    if (json.ok) {
      todosRegistros = json.data;
      document.getElementById('sync-txt').textContent =
        `Conectado · ${todosRegistros.length} registros · ${new Date().toLocaleTimeString('es-CL')}`;
      renderTablaHoy();
    }
  } catch(e) {
    document.getElementById('sync-txt').textContent = '⚠ Error de conexión';
  }
}

function renderTablaHoy() {
  const fecha = document.getElementById('f-fecha').value;
  const zona  = document.getElementById('f-zona').value;
  const est   = document.getElementById('f-estado').value;

  let data = todosRegistros;
  if (fecha) data = data.filter(r => r.FECHA === fecha);
  if (zona)  data = data.filter(r => r.ZONA === zona);
  if (est)   data = data.filter(r => r.ESTADO === est);

  // KPIs
  const hoyData = fecha ? data : todosRegistros.filter(r => r.FECHA === new Date().toISOString().split('T')[0]);
  const total    = hoyData.length;
  const presentes = hoyData.filter(r => r.ESTADO === '1').length;
  const faltas   = hoyData.filter(r => r.ESTADO === 'F').length;
  const te       = hoyData.filter(r => r.ESTADO === 'TE').length;
  const pct      = total > 0 ? Math.round((presentes/total)*100) : 0;

  document.getElementById('kpis-hoy').innerHTML = `
    <div class="kpi k-o"><div class="kv">${total}</div><div class="kl">Total</div></div>
    <div class="kpi k-g"><div class="kv">${presentes}</div><div class="kl">Presentes</div></div>
    <div class="kpi k-r"><div class="kv">${faltas}</div><div class="kl">Faltas</div></div>
    <div class="kpi k-y"><div class="kv">${te}</div><div class="kl">T.Extra</div></div>
    <div class="kpi k-b"><div class="kv">${pct}%</div><div class="kl">Cumplim.</div></div>
  `;

  const wrap = document.getElementById('tabla-hoy-wrap');
  if (data.length === 0) {
    wrap.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div>No hay registros para este filtro</div>';
    return;
  }

  wrap.innerHTML = `
    <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Fecha</th><th>Zona</th><th>Turno</th><th>Instalación</th>
        <th>Cargo</th><th>Nombre</th><th>RUT</th><th>Estado</th><th>Supervisor</th>
      </tr></thead>
      <tbody>
        ${data.map(r => `
          <tr>
            <td>${r.FECHA||''}</td>
            <td>${r.ZONA||''}</td>
            <td>${r.TURNO||''}</td>
            <td>${r.INSTALACION||''}</td>
            <td>${r.CARGO||''}</td>
            <td style="font-weight:600">${r.NOMBRE||''}</td>
            <td style="font-family:monospace;font-size:11px">${r.RUT||''}</td>
            <td><span class="badge badge-${r.ESTADO||''}">${INC_LABELS[r.ESTADO]||r.ESTADO||''}</span></td>
            <td style="color:var(--txm)">${r.SUPERVISOR||''}</td>
          </tr>`).join('')}
      </tbody>
    </table></div>`;
}

function renderHistorico() {
  const desde = document.getElementById('h-desde').value;
  const hasta = document.getElementById('h-hasta').value;
  const zona  = document.getElementById('h-zona').value;

  let data = todosRegistros;
  if (desde) data = data.filter(r => r.FECHA >= desde);
  if (hasta) data = data.filter(r => r.FECHA <= hasta);
  if (zona)  data = data.filter(r => r.ZONA === zona);

  const wrap = document.getElementById('tabla-hist-wrap');
  if (data.length === 0) {
    wrap.innerHTML = '<div class="empty-state"><div class="empty-icon">📅</div>No hay registros en ese rango</div>';
    return;
  }

  wrap.innerHTML = `
    <div style="margin-bottom:12px;font-size:13px;color:var(--txm)">${data.length} registros encontrados</div>
    <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Fecha</th><th>Zona</th><th>Turno</th><th>Instalación</th>
        <th>Nombre</th><th>Estado</th><th>Supervisor</th>
      </tr></thead>
      <tbody>
        ${data.map(r => `
          <tr>
            <td>${r.FECHA||''}</td><td>${r.ZONA||''}</td><td>${r.TURNO||''}</td>
            <td>${r.INSTALACION||''}</td>
            <td style="font-weight:600">${r.NOMBRE||''}</td>
            <td><span class="badge badge-${r.ESTADO||''}">${INC_LABELS[r.ESTADO]||r.ESTADO||''}</span></td>
            <td style="color:var(--txm)">${r.SUPERVISOR||''}</td>
          </tr>`).join('')}
      </tbody>
    </table></div>`;
}

function exportarCSV() {
  const desde = document.getElementById('h-desde').value;
  const hasta = document.getElementById('h-hasta').value;
  const zona  = document.getElementById('h-zona').value;

  let data = todosRegistros;
  if (desde) data = data.filter(r => r.FECHA >= desde);
  if (hasta) data = data.filter(r => r.FECHA <= hasta);
  if (zona)  data = data.filter(r => r.ZONA === zona);

  if (!data.length) { toast('⚠ No hay datos para exportar'); return; }

  const headers = ['FECHA','ZONA','TURNO','INSTALACION','CARGO','NOMBRE','RUT','ESTADO','SUPERVISOR'];
  const csv = [headers, ...data.map(r => headers.map(h => `"${r[h]||''}"`))].map(r => r.join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `asistencia_${desde||'todo'}_${hasta||'todo'}.csv`;
  a.click();
  toast('✅ CSV exportado');
}

// NÓMINA
function renderNomina() {
  const cont = document.getElementById('nomina-lista');
  if (empleados.length === 0) {
    cont.innerHTML = '<div class="empty-state">No hay trabajadores en la nómina</div>';
    return;
  }
  cont.innerHTML = empleados.map((e,i) => `
    <div class="nom-card">
      <div class="nom-info">
        <div class="nom-nombre">${e.nombre}</div>
        <div class="nom-meta">${e.rut} · ${e.cargo} · ${e.instalacion} · ${e.zona}</div>
        <div class="nom-meta" style="margin-top:2px">${e.turno} · ${e.jornada} · SAP: ${e.sap||'-'}</div>
      </div>
      <button onclick="eliminarTrabajador(${i})" style="background:rgba(239,68,68,.1);
        border:1px solid rgba(239,68,68,.3);color:var(--red);padding:6px 12px;
        border-radius:8px;font-size:12px;cursor:pointer;font-family:var(--font)">✕</button>
    </div>`).join('');
}

function toggleFormNomina() {
  const f = document.getElementById('nom-form');
  f.classList.toggle('show');
}

function guardarTrabajador() {
  const rut    = document.getElementById('n-rut').value.trim();
  const nombre = document.getElementById('n-nombre').value.trim().toUpperCase();
  const cargo  = document.getElementById('n-cargo').value;
  const zona   = document.getElementById('n-zona').value;
  const inst   = document.getElementById('n-inst').value.trim();
  const turno  = document.getElementById('n-turno').value;
  const jornada= document.getElementById('n-jornada').value;
  const sap    = document.getElementById('n-sap').value;

  if (!rut || !nombre) { toast('⚠ RUT y Nombre son obligatorios'); return; }

  empleados.push({rut, nombre, cargo, zona, instalacion: inst, turno, jornada, sap: sap || null});
  guardarNomina();
  renderNomina();
  toggleFormNomina();
  ['n-rut','n-nombre','n-inst','n-sap'].forEach(id => document.getElementById(id).value = '');
  toast('✅ Trabajador agregado');
}

function eliminarTrabajador(idx) {
  if (!confirm(`¿Eliminar a ${empleados[idx].nombre}?`)) return;
  empleados.splice(idx, 1);
  guardarNomina();
  renderNomina();
  toast('✅ Trabajador eliminado');
}

// TOAST
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// EVENT DELEGATION para botones de slots (evita problemas con comillas en onclick inline)
document.addEventListener('click', function(e) {
  // Botón asignar / cambiar
  const btnAsignar = e.target.closest('.slot-asignar-btn');
  if (btnAsignar) {
    const key   = btnAsignar.dataset.modalKey;
    const turno = btnAsignar.dataset.modalTurno;
    const cargo = btnAsignar.dataset.modalCargo;
    if (key) abrirModal(key, turno, cargo);
    return;
  }
  // Botón quitar
  const btnQuitar = e.target.closest('.slot-quitar-btn');
  if (btnQuitar) {
    const key = btnQuitar.dataset.quitarKey;
    if (key) {
      const asig = asignacionesPuesto[key];
      if (asig) { delete registrosHoy[asig.rut]; delete extraInfo[asig.rut]; }
      delete asignacionesPuesto[key];
      renderWorkers();
      actualizarProgreso();
      toast('✕ Trabajador quitado');
    }
    return;
  }
  // Botón estado
  const btnEst = e.target.closest('.slot-est-btn');
  if (btnEst) {
    const key = btnEst.dataset.key;
    const rut = btnEst.dataset.rut;
    const cod = btnEst.dataset.cod;
    if (key && rut && cod) {
      // Si se quita TE o HD, limpiar datos extra correspondientes
      if (cod !== 'TE') { delete extraInfo[rut]?.tipo; delete extraInfo[rut]?.horas; delete extraInfo[rut]?.monto; delete extraInfo[rut]?.monto_custom; }
      if (cod !== 'HD') { if(extraInfo[rut]) delete extraInfo[rut].hd_horas; }
      setSlotEstado(key, rut, cod);
    }
    return;
  }
  // Botón tipo TE (Horas / Bono)
  const btnTeTipo = e.target.closest('.te-tipo-btn');
  if (btnTeTipo) {
    const rut  = btnTeTipo.dataset.teRut;
    const tipo = btnTeTipo.dataset.teTipo;
    if (!extraInfo[rut]) extraInfo[rut] = {};
    extraInfo[rut].tipo = tipo;
    delete extraInfo[rut].horas;
    delete extraInfo[rut].monto;
    delete extraInfo[rut].monto_custom;
    renderWorkers();
    return;
  }
});

// Cambios en selects/inputs del panel TE
document.addEventListener('change', function(e) {
  const sel = e.target.closest('.te-select');
  if (!sel) return;
  const rut   = sel.dataset.teRut;
  const campo = sel.dataset.teCampo;
  if (!rut || !campo) return;
  if (!extraInfo[rut]) extraInfo[rut] = {};
  extraInfo[rut][campo] = sel.value;
  // Si eligió "otro monto" re-renderizar para mostrar input
  if (campo === 'monto' && sel.value === 'otro') renderWorkers();
});

document.addEventListener('input', function(e) {
  const inp = e.target.closest('input[data-te-campo="monto_custom"]');
  if (!inp) return;
  const rut = inp.dataset.teRut;
  if (!extraInfo[rut]) extraInfo[rut] = {};
  extraInfo[rut].monto_custom = inp.value;
});
